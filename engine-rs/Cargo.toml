[package]
# MUST match the top-level VERSION file. CI and the release workflow both
# hard-assert this equality and the release never patches it on the fly.
name = "abuseguard"
version = "1.1.1"
edition = "2021"
description = "caddy-abuseguard engine (Rust rewrite)"

[[bin]]
name = "caddy-abuseguard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", features = ["fs", "process"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
