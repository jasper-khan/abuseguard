[package]
# keep in sync with the top-level VERSION file; install.sh --from-source and
# release.yml both assert the binary's reported version against it.
name = "abuseguard"
version = "0.7.1"
edition = "2021"
description = "caddy-abuseguard engine (Rust rewrite)"

[[bin]]
name = "caddy-abuseguard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "0.38", features = ["fs", "process"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
