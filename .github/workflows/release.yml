name: release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 3 * * 0'      # weekly (Sun 03:00 UTC): rebuild Caddy against upstream latest
  workflow_dispatch: {}       # manual "rebuild Caddy now" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build engine binaries (linux amd64/arm64, static musl)
        if: github.event_name == 'push'
        working-directory: engine-rs
        env:
          # target-scoped linker/CC for the static musl builds; lld flags live
          # inside the arm64 build command because RUSTFLAGS is global.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: clang
          CC_aarch64_unknown_linux_musl: clang
          AR_aarch64_unknown_linux_musl: llvm-ar
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ../VERSION)"
          [ -n "$version" ] || { echo "VERSION is empty" >&2; exit 1; }
          # the tag itself must carry the same version: 0.7.1 code under a
          # v0.7.2 tag would boot, but every installer run against that
          # release would refuse the binary.
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          }
          # Let Cargo parse the actual package metadata; do not rewrite the
          # manifest (that would invalidate the locked dependency graph).
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          manifest_version="$(cargo "+$RUST_TOOLCHAIN" metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "abuseguard") | .version')"
          [ "$manifest_version" = "$version" ] || {
            echo "Cargo.toml says $manifest_version but VERSION says $version;" >&2
            echo "bump both in the same commit and re-tag" >&2
            exit 1
          }
          mkdir -p ../dist
          cargo "+$RUST_TOOLCHAIN" test --locked
          rustup "+$RUST_TOOLCHAIN" target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools clang lld llvm qemu-user-static
          cargo "+$RUST_TOOLCHAIN" build --locked --release --target x86_64-unknown-linux-musl
          RUSTFLAGS="-C link-arg=-Qunused-arguments -C link-arg=-target -C link-arg=aarch64-unknown-linux-musl -C link-arg=-fuse-ld=lld" \
            cargo "+$RUST_TOOLCHAIN" build --locked --release --target aarch64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/caddy-abuseguard ../dist/caddy-abuseguard-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/caddy-abuseguard ../dist/caddy-abuseguard-linux-arm64
          chmod 0755 ../dist/caddy-abuseguard-linux-*
          # Require successful startup and the exact version on both artifacts.
          bash ../scripts/check-engine-version.sh ../VERSION ../dist/caddy-abuseguard-linux-amd64
          bash ../scripts/check-engine-version.sh ../VERSION ../dist/caddy-abuseguard-linux-arm64 qemu-aarch64-static
          for engine in ../dist/caddy-abuseguard-linux-{amd64,arm64}; do
            dynamic="$(readelf -d "$engine")"
            if grep -q NEEDED <<< "$dynamic"; then
              echo "$engine is not static" >&2
              exit 1
            fi
          done

      # Scheduled/manual refreshes may update Caddy, but a versioned engine is
      # immutable. Download the existing engine assets instead of rebuilding
      # and silently replacing them under the same version number.
      - name: Download immutable engine assets for Caddy-only refresh
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dist
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          [ -n "$tag" ] || { echo "no existing release to refresh" >&2; exit 1; }
          echo "LATEST_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'caddy-abuseguard-linux-*' \
            --pattern 'BUILD-METADATA.json' \
            --pattern 'SHA256SUMS.txt'
          version="$(jq -er '.abuseguard_version | strings | select(length > 0)' dist/BUILD-METADATA.json)"
          [ "$tag" = "v$version" ] || {
            echo "existing metadata version $version does not match release tag $tag" >&2
            exit 1
          }
          # Never write a fresh checksum for broken or missing immutable bytes.
          # The existing Caddy checksums are ignored because Caddy is rebuilt below.
          (
            cd dist
            for engine in caddy-abuseguard-linux-{amd64,arm64}; do
              awk -v asset="$engine" '
                $2 == asset || $2 == "*" asset { print; count++ }
                END { exit count != 1 }
              ' SHA256SUMS.txt > "$engine.sha256" || {
                echo "expected exactly one checksum for $engine" >&2
                exit 1
              }
              sha256sum --strict -c "$engine.sha256"
            done
          )

      - name: Build Caddy with caddy-dns/cloudflare (linux amd64/arm64, upstream latest)
        run: |
          set -eu
          mkdir -p dist
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              "$(go env GOPATH)/bin/xcaddy" build \
              --with github.com/caddy-dns/cloudflare \
              --output "dist/caddy-linux-$arch"
          done

      # Gate: the freshly built Caddy must still produce a log the fail2ban
      # filters match. We deliberately track upstream latest, so this is what
      # keeps an incompatible Caddy from silently disabling every jail. On
      # failure the job stops here, before any upload, so releases/latest keeps
      # the last known-good binary.
      - name: Install fail2ban (for fail2ban-regex)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fail2ban

      - name: Verify log <-> filter contract (built Caddy, amd64)
        run: |
          set -eu
          chmod +x dist/caddy-linux-amd64
          bash ./scripts/verify-log-contract.sh "$PWD/dist/caddy-linux-amd64"

      - name: Checksums
        run: ( cd dist && sha256sum caddy-abuseguard-linux-{amd64,arm64} caddy-linux-{amd64,arm64} > SHA256SUMS.txt )

      # Regenerated on every run. On refresh, preserve the engine provenance
      # from the existing release and update only the Caddy provenance.
      - name: Generate build metadata
        run: |
          set -eu
          xcaddy_ver="$(go list -m -versions github.com/caddyserver/xcaddy | awk '{print $NF}')"
          cf_ver="$(go list -m -versions github.com/caddy-dns/cloudflare | awk '{print $NF}')"
          go_ver="$(go version | awk '{print $3}')"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            rustc_ver="$(rustc "+$RUST_TOOLCHAIN" --version | awk '{print $2}')"
            version="$(tr -d '[:space:]' < VERSION)"
            engine="$(jq -cn \
              --arg source_commit "$GITHUB_SHA" \
              --arg built_at "$built_at" \
              --arg rustc_version "$rustc_ver" \
              '{source_commit:$source_commit,built_at:$built_at,rustc_version:$rustc_version}')"
          else
            version="$(jq -r '.abuseguard_version' dist/BUILD-METADATA.json)"
            engine="$(jq -c '
              if .engine then .engine else {
                source_commit: .source_commit,
                built_at: .built_at,
                go_version: .go_version
              } end' dist/BUILD-METADATA.json)"
          fi
          jq -n \
            --arg version "$version" \
            --argjson engine "$engine" \
            --arg source_commit "$GITHUB_SHA" \
            --arg built_at "$built_at" \
            --arg go_version "$go_ver" \
            --arg xcaddy_version "$xcaddy_ver" \
            --arg cloudflare_version "$cf_ver" \
            '{
              schema_version: 3,
              abuseguard_version: $version,
              engine: $engine,
              caddy: {
                source_commit: $source_commit,
                built_at: $built_at,
                go_version: $go_version,
                xcaddy_version: $xcaddy_version,
                caddy_dns_cloudflare_version: $cloudflare_version
              }
            }' > dist/BUILD-METADATA.json.new
          mv dist/BUILD-METADATA.json.new dist/BUILD-METADATA.json

      # On a version tag: publish that tag's release.
      - name: Publish tagged release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/caddy-abuseguard-linux-amd64
            dist/caddy-abuseguard-linux-arm64
            dist/caddy-linux-amd64
            dist/caddy-linux-arm64
            dist/SHA256SUMS.txt
            dist/BUILD-METADATA.json

      # On schedule/manual run, refresh only Caddy plus the combined checksums
      # and metadata. The versioned engine assets remain byte-for-byte stable.
      - name: Refresh assets on latest release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "refreshing Caddy assets on $LATEST_RELEASE_TAG"
          gh release upload "$LATEST_RELEASE_TAG" \
            dist/caddy-linux-amd64 dist/caddy-linux-arm64 \
            dist/SHA256SUMS.txt dist/BUILD-METADATA.json \
            --clobber --repo "$GITHUB_REPOSITORY"
