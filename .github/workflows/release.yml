name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build engine binaries (linux amd64/arm64)
        working-directory: engine
        run: |
          set -eu
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../dist/caddy-abuseguard-linux-$arch" .
          done
          ( cd ../dist && sha256sum caddy-abuseguard-linux-* > SHA256SUMS.txt )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/caddy-abuseguard-linux-amd64
            dist/caddy-abuseguard-linux-arm64
            dist/SHA256SUMS.txt
