# fail2ban action: queue a supported web-probe or SSH offender for
# privacy-safe AbuseIPDB auto-reporting.
#
# This action NEVER touches the firewall. Blocking is done separately by each
# jail's `nftables` action. This one only appends the offender to AbuseGuard's
# report queue via the engine's `enqueue` subcommand, running as the
# unprivileged `abuseguard` user. The report timer flushes the queue later.
# Best-effort: never fail the ban action on non-public IPs or queue I/O errors
# (fail2ban-rs withholds status/SQLite persistence while any action is failing);
# forward real failures to syslog because a bare `|| true` hides stderr at INFO.
[Definition]
norestored = 1
actionstart =
actionstop =
actioncheck =
actionban = out="$(/usr/bin/setpriv --reuid=abuseguard --regid=abuseguard --init-groups -- /usr/local/libexec/caddy-abuseguard enqueue --ip <ip> --profile <profile> --failures <failures> --window <window> --transport <transport> --port <target_port> 2>&1)" || logger -t caddy-abuseguard -p daemon.err -- "${out:-enqueue failed}" 2>/dev/null || true
actionunban =

[Init]
profile = web-probe
transport = HTTP/1.1
target_port = 443
window = 10m
