# fail2ban action: queue an offender for AbuseIPDB auto-reporting.
#
# This action NEVER touches the firewall. Blocking is done separately by each
# jail's `nftables` action. This one only appends the offender to AbuseGuard's
# report queue via the engine's `enqueue` subcommand, running as the
# unprivileged `abuseguard` user. The report timer flushes the queue later.
[Definition]
norestored = 1
actionstart =
actionstop =
actioncheck =
actionban = /usr/sbin/runuser -u abuseguard -- /usr/local/libexec/caddy-abuseguard enqueue --ip <ip> --profile <profile> --failures <failures> --window <window> --transport <transport> --port <target_port> --mode auto
actionunban =

[Init]
profile = web-rate
transport = HTTP
target_port = 443
window = 60s
