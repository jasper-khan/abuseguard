# fail2ban filter: any request to an AbuseGuard-protected Caddy site.
#
# Reads the privacy-trimmed JSON access log written by the (abuseguard) snippet.
# Order-independent lookaheads, so it matches regardless of JSON field order.
# Used by the intel jail (instant ban of known-bad IPs) and the rate jail.
[Definition]
failregex = ^(?=.*"caddy_abuseguard_site":"protected")(?=.*"client_ip":"<ADDR>").*$
ignoreregex =
