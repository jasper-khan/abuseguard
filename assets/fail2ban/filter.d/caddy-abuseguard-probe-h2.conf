# fail2ban filter: HTTP/2 probing of sensitive paths on a protected site.
# The (abuseguard) snippet tags such requests with caddy_abuseguard_probe=web-probe.
[Definition]
failregex = ^(?=.*"client_ip":"<ADDR>")(?=.*"proto":"HTTP/2\.0")(?=.*"caddy_abuseguard_site":"protected")(?=.*"caddy_abuseguard_probe":"web-probe").*$
ignoreregex =
